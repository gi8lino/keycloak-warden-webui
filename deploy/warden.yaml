protected-ips:
  - 192.0.2.10
  - 198.51.100.0/24
  - 2001:db8:1234::/48

# Deliberately low threshold for end-to-end testing.
rules:
  brute-force:
    selector:
      kind: user
      events: [LOGIN_ERROR]
    aggregation:
      group-by: ip
      threshold: 2
      window: 1m
    actions:
      ban: 15m

enforcements:
  webhook:
    receiver:
      # Receiver shares Warden's network namespace (loopback HTTP is allowed).
      url: env:WARDEN_E2E_WEBHOOK_URL
      headers:
        X-API-Key: env:WARDEN_E2E_WEBHOOK_KEY
