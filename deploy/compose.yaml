# Local-only integration stack. The Web UI and Hookglass share Warden's
# network namespace, so their upstream HTTP connections stay on loopback.
# Run through `make e2e-up`; no Warden source checkout is required.
services:
  warden:
    # Keep the pinned image in sync with the Warden client dependency in go.mod.
    image: ${E2E_WARDEN_IMAGE:-ghcr.io/gi8lino/keycloak-warden:v0.43.0}
    command:
      - serve
      - --config=/config/warden.yaml
      - --database=/data/warden.db
      - --listen-address=:8080
      - --management-listen-address=:8081
      - --access-log
      - --log-format=text
      - --metrics
    environment:
      WARDEN__SNITCH_SECRET: development-snitch-secret
      WARDEN__ADMIN_TOKEN: development-admin-token
      WARDEN_E2E_WEBHOOK_URL: http://127.0.0.1:8090/header
      WARDEN_E2E_WEBHOOK_KEY: development-outbound-key
    ports:
      - "127.0.0.1:${E2E_WARDEN_PORT:-18081}:8080"
      - "127.0.0.1:${E2E_WARDEN_MANAGEMENT_PORT:-18082}:8081"
      - "127.0.0.1:${E2E_HOOKGLASS_PORT:-18090}:8090"
      - "127.0.0.1:${E2E_WEBUI_PORT:-18092}:8082"
      - "127.0.0.1:${E2E_WEBUI_MANAGEMENT_PORT:-18093}:8083"
    volumes:
      - state:/data
      - ./warden.yaml:/config/warden.yaml:ro

  receiver:
    image: ghcr.io/gi8lino/hookglass:v0.1.2
    network_mode: service:warden
    depends_on:
      warden:
        condition: service_started
    command:
      - --config=/config/header.yaml
      - --listen-address=:8090
    environment:
      WEBHOOK_API_KEY: development-outbound-key
    volumes:
      - ./hookglass.yaml:/config/header.yaml:ro

  webui:
    build:
      context: ..
    network_mode: service:warden
    volumes:
      - webui-state:/data
    depends_on:
      warden:
        condition: service_started
      receiver:
        condition: service_started
    environment:
      WARDEN_WEBUI__LISTEN_ADDRESS: ":8082"
      WARDEN_WEBUI__MANAGEMENT_LISTEN_ADDRESS: ":8083"
      WARDEN_WEBUI__PUBLIC_URL: "http://127.0.0.1:${E2E_WEBUI_PORT:-18092}"
      WARDEN_WEBUI__WARDEN_URL: "http://127.0.0.1:8080"
      WARDEN_WEBUI__WARDEN_ADMIN_TOKEN: development-admin-token
      WARDEN_WEBUI__AUTH_MODE: local
      WARDEN_WEBUI__DATABASE: /data/warden-webui.db
      # Demo-only bootstrap token. Supply a different random secret in production.
      WARDEN_WEBUI__SETUP_TOKEN: development-setup-token-0123456789abcdef

volumes:
  state:
  webui-state:
