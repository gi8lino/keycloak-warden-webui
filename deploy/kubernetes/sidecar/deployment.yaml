# Alternative 1: one Pod runs Warden plus WebUI, with separate SQLite PVCs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-warden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-warden
      app.kubernetes.io/component: keycloak-warden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-warden
        app.kubernetes.io/component: keycloak-warden
        app.kubernetes.io/warden-webui: enabled
    spec:
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak-warden
          image: ghcr.io/gi8lino/keycloak-warden:v0.13.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/config/warden.yaml
            - --database=/data/warden.db
            - --listen-address=:8080
            - --management-listen-address=:8081
            - --metrics
            - --access-log
          env:
            - name: WARDEN__SNITCH_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-snitch
                  key: KC_SPI_EVENTS_LISTENER__SNITCH__WEBHOOK_SECRET
          envFrom:
            - secretRef:
                name: keycloak-warden
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: management
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 0
          volumeMounts:
            - name: warden-config
              mountPath: /config
              readOnly: true
            - name: warden-data
              mountPath: /data
            - name: warden-tmp
              mountPath: /tmp
        - name: warden-webui
          # Pin a published WebUI release tag or digest before production use.
          image: ghcr.io/gi8lino/warden-webui:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: keycloak-warden-webui-config
          env:
            - name: WARDEN_WEBUI__WARDEN_URL
              value: http://127.0.0.1:8080
            # Reuse the exact admin token Warden validates.
            - name: WARDEN_WEBUI__WARDEN_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: keycloak-warden
                  key: WARDEN__ADMIN_TOKEN
            - name: WARDEN_WEBUI__SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: keycloak-warden-webui
                  key: setup-token
          ports:
            - name: webui-http
              containerPort: 8092
              protocol: TCP
            - name: webui-mgmt
              containerPort: 8093
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: webui-mgmt
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: webui-mgmt
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: webui-mgmt
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 0
          volumeMounts:
            - name: webui-data
              mountPath: /data
      volumes:
        - name: warden-config
          configMap:
            name: keycloak-warden-config
            items:
              - key: warden.yaml
                path: warden.yaml
        - name: warden-data
          persistentVolumeClaim:
            claimName: keycloak-warden-data
        - name: webui-data
          persistentVolumeClaim:
            claimName: keycloak-warden-webui-data
        - name: warden-tmp
          emptyDir: {}
