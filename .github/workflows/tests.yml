---
name: Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "themes/**"
      - "test/**"
      - "scripts/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "Makefile"
      - "bin/dev-tools.mk"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  go:
    name: Go verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies and development tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make dev-tools
          go mod download

      - name: Verify module manifests
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format, lint and race-test
        run: make verify

  e2e:
    name: Browser authentication and real Warden E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser authentication tests
        run: make e2e-auth-test

      - name: Check Docker Compose
        run: docker compose version

      - name: Run real Warden browser tests
        run: make e2e-test

      - name: Show service logs on failure
        if: failure()
        run: docker compose -p warden-webui-e2e -f test/e2e/compose.yaml -f test/e2e/compose.test.yaml logs --no-color --tail=200

      - name: Remove E2E containers and volumes
        if: always()
        run: make e2e-reset E2E_STACK_TEST=1
