# The browser and Web UI must resolve the same issuer. Keycloak shares
# Warden's network namespace and listens on the published loopback port.
services:
  warden:
    ports:
      - "127.0.0.1:${E2E_KEYCLOAK_PORT}:${E2E_KEYCLOAK_PORT}"
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    network_mode: service:warden
    command: ["start-dev", "--import-realm", "--http-port=${E2E_KEYCLOAK_PORT}"]
    environment:
      WEBUI_CALLBACK: "http://127.0.0.1:${E2E_WEBUI_PORT}/auth/callback"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
    volumes:
      - ./realm/webui-e2e.json:/opt/keycloak/data/import/webui.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
  webui:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      WARDEN_WEBUI__AUTH_MODE: oidc
      WARDEN_WEBUI__OIDC_ISSUER: "http://127.0.0.1:${E2E_KEYCLOAK_PORT}/realms/warden-test"
      WARDEN_WEBUI__OIDC_CLIENT_ID: webui
      WARDEN_WEBUI__OIDC_CLIENT_SECRET: e2e-client-secret
      WARDEN_WEBUI__OIDC_SESSION_SECRET: e2e-only-oidc-state-secret-32-characters
      WARDEN_WEBUI__OIDC_GROUP_CLAIM: groups
      WARDEN_WEBUI__SETUP_SUBJECT: 36a15cdc-ed1b-489e-ab8c-198790c9e920
